# ============================================================================
# AKILIYA — Infrastructure partagée VPS
# Traefik + PostgreSQL + Redis — 1 instance, N projets
# ============================================================================
#
# DÉMARRAGE INITIAL :
#   cd /home/deploy/infra
#   docker compose -f docker-compose.shared.yml up -d
#
# VARIABLES requises dans .env.infra (jamais dans Git) :
#   POSTGRES_SUPERUSER, POSTGRES_SUPERPASSWORD
#   REDIS_PASSWORD
#   ACME_EMAIL
#
# ============================================================================

name: akiliya-infra

services:

  # ══════════════════════════════════════════════════════════════════════════
  # Traefik — Reverse proxy + SSL Let's Encrypt automatique
  # Toutes les routes SaaS passent par lui (labels Traefik dans chaque SaaS)
  # ══════════════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.2
    container_name: akiliya-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.dashboard=false"
      # Docker provider — découverte automatique via labels
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=akiliya-infra-network"
      # HTTP → HTTPS redirect automatique
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt TLS Challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    volumes:
      # Socket Docker en lecture seule (sécurité)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - infra-network
    labels:
      - "cic.service=traefik"
      - "cic.project=akiliya-infra"

  # ══════════════════════════════════════════════════════════════════════════
  # PostgreSQL 16 — 1 instance, N databases (une par SaaS × env)
  # Accès depuis les SaaS : host = akiliya-postgres (via infra-network)
  # ══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: akiliya-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      # C.UTF-8 : locale toujours présente dans postgres:16-alpine
      # (fr_FR.UTF-8 n'y est pas → initdb échouerait).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # Transmis au script d'init 01-create-databases.sh
      AKITEXT_DB_PASSWORD: ${AKITEXT_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts d'init — créent les databases et users par SaaS
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - infra-network
    # Port non exposé publiquement — accessible uniquement via infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "cic.service=postgres"
      - "cic.project=akiliya-infra"

  # ══════════════════════════════════════════════════════════════════════════
  # Redis 7 — 1 instance, databases séparées par SaaS (DB 0-15)
  # Accès depuis les SaaS : host = akiliya-redis (via infra-network)
  # ══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: akiliya-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "cic.service=redis"
      - "cic.project=akiliya-infra"

networks:
  infra-network:
    name: akiliya-infra-network
    driver: bridge

volumes:
  postgres-data:
    name: akiliya-postgres-data
    driver: local
  redis-data:
    name: akiliya-redis-data
    driver: local
  traefik-letsencrypt:
    name: akiliya-traefik-letsencrypt
    driver: local
